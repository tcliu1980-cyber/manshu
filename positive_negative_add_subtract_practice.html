<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>20 以內正負數加減練習</title>
  <style>
    :root {
      --bg-1: #0f172a;
      --bg-2: #1e293b;
      --card: rgba(255, 255, 255, 0.96);
      --ink: #172033;
      --muted: #64748b;
      --blue: #2563eb;
      --red: #dc2626;
      --green: #15803d;
      --gold: #f59e0b;
      --line: #cbd5e1;
      --shadow: 0 22px 60px rgba(2, 6, 23, 0.28);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 10%, rgba(37, 99, 235, 0.32), transparent 34%),
        radial-gradient(circle at 88% 84%, rgba(245, 158, 11, 0.22), transparent 30%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
      display: grid;
      place-items: center;
      padding: 24px;
    }

    button, input { font: inherit; }

    .app {
      width: min(1120px, 100%);
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 28px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 18px;
      align-items: center;
      padding: 22px 28px;
      color: white;
      background: linear-gradient(100deg, #1d4ed8, #4338ca);
    }

    .title h1 {
      margin: 0;
      font-size: clamp(1.3rem, 3vw, 2rem);
      letter-spacing: 0.04em;
    }

    .title p {
      margin: 5px 0 0;
      color: rgba(255, 255, 255, 0.78);
      font-size: 0.95rem;
    }

    .progress-box {
      min-width: 112px;
      text-align: center;
      font-weight: 800;
    }

    .progress-box .big {
      display: block;
      font-size: 1.55rem;
    }

    .timer {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 122px;
      justify-content: flex-end;
    }

    .bomb {
      position: relative;
      font-size: 2.7rem;
      line-height: 1;
      transform-origin: 50% 70%;
      animation: bombTick 0.65s infinite alternate ease-in-out;
      filter: drop-shadow(0 6px 6px rgba(0, 0, 0, 0.28));
    }

    .bomb::after {
      content: "";
      position: absolute;
      width: 8px;
      height: 8px;
      right: -3px;
      top: -2px;
      border-radius: 50%;
      background: #fde047;
      box-shadow: 0 0 8px 3px #fb923c;
      animation: spark 0.35s infinite alternate;
    }

    @keyframes bombTick {
      from { transform: rotate(-4deg) scale(1); }
      to { transform: rotate(4deg) scale(1.04); }
    }

    @keyframes spark {
      from { opacity: 0.45; transform: scale(0.65); }
      to { opacity: 1; transform: scale(1.25); }
    }

    .time-number {
      font-size: 2rem;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }

    .time-number.danger {
      color: #fde047;
      animation: pulse 0.5s infinite alternate;
    }

    @keyframes pulse {
      to { transform: scale(1.1); }
    }

    .content {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 24px;
      padding: 30px;
    }

    .question-panel {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .question-card {
      min-height: 155px;
      border-radius: 22px;
      border: 2px solid #dbeafe;
      background: linear-gradient(180deg, #eff6ff, #ffffff);
      padding: 24px;
      display: grid;
      place-items: center;
      text-align: center;
    }

    .expression {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      font-size: clamp(2rem, 6vw, 4.6rem);
      font-weight: 900;
      letter-spacing: 0.02em;
      font-variant-numeric: tabular-nums;
    }

    .answer-display {
      min-width: 148px;
      min-height: 1.2em;
      padding: 0 13px 7px;
      border-bottom: 6px solid #334155;
      color: #111827;
      overflow-wrap: anywhere;
    }

    .answer-display.placeholder::after {
      content: "__";
      color: #94a3b8;
    }

    .answer-display.correct {
      color: var(--green);
      border-color: var(--green);
    }

    .answer-display.wrong {
      color: var(--red);
      border-color: var(--red);
    }

    .feedback {
      min-height: 34px;
      margin-top: 12px;
      font-size: 1.2rem;
      font-weight: 800;
    }

    .feedback.ok { color: var(--green); }
    .feedback.bad { color: var(--red); }

    .number-line-card {
      border-radius: 22px;
      border: 1px solid #e2e8f0;
      background: #fff;
      padding: 14px 14px 6px;
      box-shadow: 0 8px 25px rgba(15, 23, 42, 0.07);
    }

    .number-line-title {
      margin: 2px 8px 0;
      color: var(--muted);
      font-weight: 700;
    }

    #numberLine {
      width: 100%;
      min-height: 210px;
      display: block;
    }

    .hint {
      margin: 0 8px 10px;
      color: var(--muted);
      font-size: 0.93rem;
      text-align: center;
    }

    .keypad {
      align-self: stretch;
      border-radius: 24px;
      padding: 20px;
      background: #111827;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .keypad-title {
      grid-column: 1 / -1;
      color: #e5e7eb;
      text-align: center;
      font-weight: 800;
      margin-bottom: 2px;
    }

    .key {
      border: 0;
      border-radius: 16px;
      min-height: 64px;
      background: #f8fafc;
      color: #111827;
      font-size: 1.65rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 5px 0 #94a3b8;
      transition: transform 0.08s ease, box-shadow 0.08s ease, opacity 0.2s;
      user-select: none;
    }

    .key:hover { background: #e0f2fe; }

    .key:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #64748b;
    }

    .key.action {
      color: white;
      background: #475569;
      box-shadow: 0 5px 0 #1e293b;
      font-size: 1.1rem;
    }

    .key.minus {
      color: white;
      background: #b45309;
      box-shadow: 0 5px 0 #78350f;
    }

    .key.enter {
      grid-column: span 2;
      color: white;
      background: #16a34a;
      box-shadow: 0 5px 0 #166534;
      font-size: 1.25rem;
    }

    .key:disabled {
      cursor: not-allowed;
      opacity: 0.45;
      transform: none;
    }

    .results {
      display: none;
      padding: 34px;
      text-align: center;
    }

    .results.show { display: block; }

    .explosion {
      font-size: clamp(5rem, 13vw, 9rem);
      line-height: 1;
      animation: explode 0.8s both cubic-bezier(.1,.9,.2,1.25);
      filter: drop-shadow(0 14px 12px rgba(220, 38, 38, 0.26));
    }

    @keyframes explode {
      0% { transform: scale(0.15) rotate(-15deg); opacity: 0; }
      55% { transform: scale(1.25) rotate(6deg); opacity: 1; }
      100% { transform: scale(1) rotate(0); }
    }

    .results h2 {
      margin: 8px 0 4px;
      font-size: clamp(2rem, 5vw, 3.3rem);
    }

    .score {
      margin: 12px auto 22px;
      font-size: 1.35rem;
      font-weight: 800;
    }

    .perfect {
      display: none;
      margin: 12px 0 24px;
      font-size: clamp(2.4rem, 8vw, 5rem);
      font-weight: 1000;
      letter-spacing: 0.08em;
      color: #f59e0b;
      text-shadow: 0 4px 0 #7c2d12, 0 8px 24px rgba(245, 158, 11, 0.4);
      animation: perfectPop 0.8s both;
    }

    .perfect.show { display: block; }

    @keyframes perfectPop {
      from { transform: scale(0.2) rotate(-8deg); opacity: 0; }
      to { transform: scale(1) rotate(0); opacity: 1; }
    }

    .mistakes {
      width: min(760px, 100%);
      margin: 0 auto 24px;
      text-align: left;
      display: grid;
      gap: 10px;
    }

    .mistake {
      border-left: 6px solid var(--red);
      border-radius: 12px;
      padding: 13px 16px;
      background: #fef2f2;
      color: var(--red);
      font-size: 1.15rem;
      font-weight: 800;
    }

    .all-correct {
      color: var(--green);
      font-weight: 800;
      margin-bottom: 24px;
    }

    .restart {
      border: 0;
      border-radius: 999px;
      padding: 14px 28px;
      color: white;
      background: #2563eb;
      font-size: 1.1rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 6px 0 #1e40af;
    }

    .restart:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #1e40af;
    }

    @media (max-width: 820px) {
      body { padding: 10px; }
      .app { border-radius: 20px; }
      .topbar {
        grid-template-columns: 1fr auto;
        padding: 18px;
      }
      .title { grid-column: 1 / -1; }
      .progress-box { text-align: left; }
      .content {
        grid-template-columns: 1fr;
        padding: 18px;
      }
      .keypad {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .key { min-height: 56px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main class="app" aria-live="polite">
    <header class="topbar">
      <div class="title">
        <h1>正負數加減挑戰</h1>
        <p>20 以內｜共 5 題｜限時 75 秒</p>
      </div>

      <div class="progress-box" aria-label="答題進度">
        <span class="big" id="progress">1 / 5</span>
        <span>目前題目</span>
      </div>

      <div class="timer" aria-label="剩餘時間">
        <div class="bomb" id="bomb" aria-hidden="true">💣</div>
        <div>
          <div class="time-number" id="timeNumber">75</div>
          <small>秒</small>
        </div>
      </div>
    </header>

    <section class="content" id="quizArea">
      <div class="question-panel">
        <div class="question-card">
          <div>
            <div class="expression" id="expression"></div>
            <div class="feedback" id="feedback"></div>
          </div>
        </div>

        <div class="number-line-card">
          <p class="number-line-title">數線提示</p>
          <svg id="numberLine" viewBox="0 0 760 190" role="img" aria-label="從負二十到二十的數線向量圖"></svg>
          <p class="hint">藍色表示第一個數；紅色表示從第一個數出發的第二步。數線不標示最後答案。</p>
        </div>
      </div>

      <aside class="keypad" id="keypad" aria-label="數字鍵盤">
        <div class="keypad-title">請用鍵盤輸入答案</div>
        <button class="key" data-key="7">7</button>
        <button class="key" data-key="8">8</button>
        <button class="key" data-key="9">9</button>
        <button class="key" data-key="4">4</button>
        <button class="key" data-key="5">5</button>
        <button class="key" data-key="6">6</button>
        <button class="key" data-key="1">1</button>
        <button class="key" data-key="2">2</button>
        <button class="key" data-key="3">3</button>
        <button class="key minus" data-key="minus" aria-label="切換正負號">±</button>
        <button class="key" data-key="0">0</button>
        <button class="key action" data-key="backspace" aria-label="刪除一位">⌫</button>
        <button class="key action" data-key="clear">清除</button>
        <button class="key enter" data-key="enter">輸入答案</button>
      </aside>
    </section>

    <section class="results" id="results">
      <div class="explosion" aria-label="炸彈爆炸">💥</div>
      <h2>挑戰結束！</h2>
      <div class="perfect" id="perfect">PERFECT!</div>
      <div class="score" id="score"></div>
      <div class="mistakes" id="mistakes"></div>
      <button class="restart" id="restart">重新挑戰</button>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const TOTAL_QUESTIONS = 5;
      const TOTAL_TIME = 75;
      const FEEDBACK_DELAY = 3000;

      const expressionEl = document.getElementById("expression");
      const feedbackEl = document.getElementById("feedback");
      const progressEl = document.getElementById("progress");
      const timeEl = document.getElementById("timeNumber");
      const numberLineEl = document.getElementById("numberLine");
      const keypadEl = document.getElementById("keypad");
      const quizAreaEl = document.getElementById("quizArea");
      const resultsEl = document.getElementById("results");
      const scoreEl = document.getElementById("score");
      const mistakesEl = document.getElementById("mistakes");
      const perfectEl = document.getElementById("perfect");
      const restartBtn = document.getElementById("restart");

      let questions = [];
      let currentIndex = 0;
      let currentInput = "";
      let answers = [];
      let timeLeft = TOTAL_TIME;
      let timerId = null;
      let nextQuestionId = null;
      let locked = false;
      let finished = false;

      const randInt = (min, max) =>
        Math.floor(Math.random() * (max - min + 1)) + min;

      function calculate(a, op, b) {
        return op === "+" ? a + b : a - b;
      }

      function formatOperand(value, parenthesizeNegative = false) {
        if (value < 0 && parenthesizeNegative) return `(${value})`;
        return String(value);
      }

      function questionText(question, includeAnswer = false) {
        const second = formatOperand(question.b, question.b < 0);
        const base = `${question.a} ${question.op} ${second} =`;
        return includeAnswer ? `${base} ${question.answer}` : base;
      }

      function generateQuestions() {
        const generated = [];
        const used = new Set();

        while (generated.length < TOTAL_QUESTIONS) {
          const a = randInt(-20, 20);
          const b = randInt(-20, 20);
          const op = Math.random() < 0.5 ? "+" : "-";
          const answer = calculate(a, op, b);

          // 排除零長度向量，並使運算結果維持在數線可見範圍內。
          if (a === 0 || b === 0 || answer < -20 || answer > 20) continue;

          const key = `${a}|${op}|${b}`;
          if (used.has(key)) continue;

          used.add(key);
          generated.push({ a, b, op, answer });
        }

        return generated;
      }

      function makeSvgElement(name, attrs = {}) {
        const node = document.createElementNS("http://www.w3.org/2000/svg", name);
        for (const [key, value] of Object.entries(attrs)) {
          node.setAttribute(key, value);
        }
        return node;
      }

      function drawNumberLine(question) {
        numberLineEl.innerHTML = "";

        const min = -20;
        const max = 20;
        const left = 52;
        const right = 708;
        const baseY = 96;
        const firstY = 68;
        const secondY = 112;

        const x = value => left + ((value - min) / (max - min)) * (right - left);
        const secondDelta = question.op === "+" ? question.b : -question.b;
        const result = question.a + secondDelta;

        const defs = makeSvgElement("defs");

        const blueMarker = makeSvgElement("marker", {
          id: "arrowBlue",
          markerWidth: "10",
          markerHeight: "10",
          refX: "8",
          refY: "3",
          orient: "auto",
          markerUnits: "strokeWidth"
        });
        blueMarker.appendChild(makeSvgElement("path", {
          d: "M0,0 L0,6 L9,3 z",
          fill: "#2563eb"
        }));

        const redMarker = makeSvgElement("marker", {
          id: "arrowRed",
          markerWidth: "10",
          markerHeight: "10",
          refX: "8",
          refY: "3",
          orient: "auto",
          markerUnits: "strokeWidth"
        });
        redMarker.appendChild(makeSvgElement("path", {
          d: "M0,0 L0,6 L9,3 z",
          fill: "#dc2626"
        }));

        defs.append(blueMarker, redMarker);
        numberLineEl.appendChild(defs);

        numberLineEl.appendChild(makeSvgElement("line", {
          x1: left,
          y1: baseY,
          x2: right,
          y2: baseY,
          stroke: "#334155",
          "stroke-width": "3",
          "stroke-linecap": "round"
        }));

        for (let value = min; value <= max; value++) {
          const major = value === -20 || value === 0 || value === 20;
          numberLineEl.appendChild(makeSvgElement("line", {
            x1: x(value),
            y1: major ? baseY - 9 : baseY - 4,
            x2: x(value),
            y2: major ? baseY + 9 : baseY + 4,
            stroke: major ? "#0f172a" : "#94a3b8",
            "stroke-width": major ? "3" : "1"
          }));
        }

        [-20, 0, 20].forEach(value => {
          const label = makeSvgElement("text", {
            x: x(value),
            y: 160,
            "text-anchor": "middle",
            fill: "#0f172a",
            "font-size": "20",
            "font-weight": "800"
          });
          label.textContent = String(value);
          numberLineEl.appendChild(label);
        });

        // 第一個數：由 0 指向 a。
        numberLineEl.appendChild(makeSvgElement("line", {
          x1: x(0),
          y1: firstY,
          x2: x(question.a),
          y2: firstY,
          stroke: "#2563eb",
          "stroke-width": "7",
          "stroke-linecap": "round",
          "marker-end": "url(#arrowBlue)"
        }));

        // 第二步：加 b 或減 b，從 a 的末端出發，向下錯開避免重疊。
        numberLineEl.appendChild(makeSvgElement("line", {
          x1: x(question.a),
          y1: secondY,
          x2: x(result),
          y2: secondY,
          stroke: "#dc2626",
          "stroke-width": "7",
          "stroke-linecap": "round",
          "marker-end": "url(#arrowRed)"
        }));

        // 連接第一個數的末端與第二步起點。
        numberLineEl.appendChild(makeSvgElement("line", {
          x1: x(question.a),
          y1: firstY + 5,
          x2: x(question.a),
          y2: secondY - 5,
          stroke: "#64748b",
          "stroke-width": "2",
          "stroke-dasharray": "4 4"
        }));

        const firstLabel = makeSvgElement("text", {
          x: (x(0) + x(question.a)) / 2,
          y: 42,
          "text-anchor": "middle",
          fill: "#1d4ed8",
          "font-size": "23",
          "font-weight": "900"
        });
        firstLabel.textContent = String(question.a);
        numberLineEl.appendChild(firstLabel);

        const secondLabel = makeSvgElement("text", {
          x: (x(question.a) + x(result)) / 2,
          y: 145,
          "text-anchor": "middle",
          fill: "#b91c1c",
          "font-size": "23",
          "font-weight": "900"
        });
        secondLabel.textContent = formatOperand(question.b, question.b < 0);
        numberLineEl.appendChild(secondLabel);
      }

      function renderQuestion() {
        if (finished) return;

        locked = false;
        currentInput = "";
        feedbackEl.textContent = "";
        feedbackEl.className = "feedback";
        progressEl.textContent = `${currentIndex + 1} / ${TOTAL_QUESTIONS}`;

        const q = questions[currentIndex];
        expressionEl.innerHTML = "";

        const formula = document.createElement("span");
        formula.textContent = `${q.a} ${q.op} ${formatOperand(q.b, q.b < 0)} =`;

        const answer = document.createElement("span");
        answer.id = "answerDisplay";
        answer.className = "answer-display placeholder";
        answer.setAttribute("aria-label", "目前輸入的答案");

        expressionEl.append(formula, answer);
        drawNumberLine(q);
        setKeypadDisabled(false);
      }

      function updateAnswerDisplay() {
        const answerEl = document.getElementById("answerDisplay");
        if (!answerEl) return;

        answerEl.textContent = currentInput;
        answerEl.classList.toggle("placeholder", currentInput === "");
      }

      function setKeypadDisabled(disabled) {
        keypadEl.querySelectorAll("button").forEach(button => {
          button.disabled = disabled;
        });
      }

      function appendDigit(digit) {
        if (locked || finished) return;

        const negative = currentInput.startsWith("-");
        let unsigned = negative ? currentInput.slice(1) : currentInput;

        if (unsigned === "0") unsigned = "";
        if (unsigned.length >= 3) return;

        unsigned += digit;
        currentInput = `${negative ? "-" : ""}${unsigned}`;
        updateAnswerDisplay();
      }

      function toggleMinus() {
        if (locked || finished) return;

        if (currentInput.startsWith("-")) {
          currentInput = currentInput.slice(1);
        } else {
          currentInput = currentInput ? `-${currentInput}` : "-";
        }
        updateAnswerDisplay();
      }

      function backspace() {
        if (locked || finished) return;
        currentInput = currentInput.slice(0, -1);
        updateAnswerDisplay();
      }

      function clearInput() {
        if (locked || finished) return;
        currentInput = "";
        updateAnswerDisplay();
      }

      function submitAnswer() {
        if (locked || finished || currentInput === "" || currentInput === "-") return;

        locked = true;
        setKeypadDisabled(true);

        const q = questions[currentIndex];
        const userAnswer = Number(currentInput);
        const correct = userAnswer === q.answer;

        answers[currentIndex] = {
          ...q,
          userAnswer,
          correct,
          status: "answered"
        };

        const answerEl = document.getElementById("answerDisplay");
        answerEl.textContent = String(q.answer);
        answerEl.classList.remove("placeholder");
        answerEl.classList.add(correct ? "correct" : "wrong");

        feedbackEl.textContent = correct
          ? `答對了！正確答案是 ${q.answer}`
          : `答錯了，正確答案是 ${q.answer}`;
        feedbackEl.className = `feedback ${correct ? "ok" : "bad"}`;

        nextQuestionId = window.setTimeout(() => {
          if (finished) return;

          currentIndex++;
          if (currentIndex >= TOTAL_QUESTIONS) {
            finishQuiz("completed");
          } else {
            renderQuestion();
          }
        }, FEEDBACK_DELAY);
      }

      function startTimer() {
        timerId = window.setInterval(() => {
          if (finished) return;

          timeLeft--;
          timeEl.textContent = String(timeLeft);
          timeEl.classList.toggle("danger", timeLeft <= 15);

          if (timeLeft <= 0) {
            finishQuiz("timeout");
          }
        }, 1000);
      }

      function finishQuiz(reason) {
        if (finished) return;
        finished = true;
        locked = true;

        window.clearInterval(timerId);
        window.clearTimeout(nextQuestionId);
        setKeypadDisabled(true);

        if (reason === "timeout") {
          for (let i = 0; i < TOTAL_QUESTIONS; i++) {
            if (!answers[i]) {
              answers[i] = {
                ...questions[i],
                userAnswer: null,
                correct: false,
                status: "unanswered"
              };
            }
          }
        }

        // 完成時保險補齊未紀錄的題目。
        for (let i = 0; i < TOTAL_QUESTIONS; i++) {
          if (!answers[i]) {
            answers[i] = {
              ...questions[i],
              userAnswer: null,
              correct: false,
              status: "unanswered"
            };
          }
        }

        const correctCount = answers.filter(item => item.correct).length;
        const rate = Math.round((correctCount / TOTAL_QUESTIONS) * 100);

        quizAreaEl.style.display = "none";
        resultsEl.classList.add("show");
        perfectEl.classList.toggle("show", correctCount === TOTAL_QUESTIONS);

        scoreEl.textContent =
          `答對 ${correctCount} 題／共 ${TOTAL_QUESTIONS} 題，正確率 ${rate}%`;

        mistakesEl.innerHTML = "";
        const wrongAnswers = answers.filter(item => !item.correct);

        if (wrongAnswers.length === 0) {
          const allCorrect = document.createElement("div");
          allCorrect.className = "all-correct";
          allCorrect.textContent = "五題全部答對，太厲害了！";
          mistakesEl.appendChild(allCorrect);
        } else {
          wrongAnswers.forEach(item => {
            const row = document.createElement("div");
            row.className = "mistake";
            const userText = item.status === "unanswered"
              ? "未作答"
              : `你的答案：${item.userAnswer}`;
            row.textContent = `${questionText(item, true)}　（${userText}）`;
            mistakesEl.appendChild(row);
          });
        }
      }

      function startQuiz() {
        window.clearInterval(timerId);
        window.clearTimeout(nextQuestionId);

        questions = generateQuestions();
        currentIndex = 0;
        currentInput = "";
        answers = [];
        timeLeft = TOTAL_TIME;
        locked = false;
        finished = false;

        timeEl.textContent = String(TOTAL_TIME);
        timeEl.classList.remove("danger");
        quizAreaEl.style.display = "";
        resultsEl.classList.remove("show");
        perfectEl.classList.remove("show");

        renderQuestion();
        startTimer();
      }

      keypadEl.addEventListener("click", event => {
        const button = event.target.closest("button[data-key]");
        if (!button) return;

        const key = button.dataset.key;
        if (/^\d$/.test(key)) appendDigit(key);
        else if (key === "minus") toggleMinus();
        else if (key === "backspace") backspace();
        else if (key === "clear") clearInput();
        else if (key === "enter") submitAnswer();
      });

      document.addEventListener("keydown", event => {
        if (finished || locked) return;

        if (/^\d$/.test(event.key)) appendDigit(event.key);
        else if (event.key === "-") toggleMinus();
        else if (event.key === "Backspace") backspace();
        else if (event.key === "Escape") clearInput();
        else if (event.key === "Enter") submitAnswer();
      });

      restartBtn.addEventListener("click", startQuiz);

      startQuiz();
    })();
  </script>
</body>
</html>
